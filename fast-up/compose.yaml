services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fastup
      POSTGRES_USER: fastup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastup"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports: ["127.0.0.1:3030:3030"]
    environment:
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://fastup:${POSTGRES_PASSWORD}@db:5432/fastup
      NODE_ENV: production
      DEMO_MODE: "false"
      HOST: 0.0.0.0
      PORT: 3030
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:?Set BOOTSTRAP_EMAIL}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3030}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
